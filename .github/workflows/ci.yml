name: CI — Lint, Type-check, Test, Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint & Formatting ───────────────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black

      - name: Ruff (linting)
        run: ruff check . --output-format=github

      - name: Black (formatting check)
        run: black --check --diff .

  # ── Type Checking ───────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements-backend.txt

      - name: mypy
        run: mypy backend/app --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Informational for Phase 2; strict in Phase 3

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arp
          POSTGRES_PASSWORD: arp_password
          POSTGRES_DB: arp_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements-backend.txt
          python -m spacy download en_core_web_sm

      - name: Set test environment variables
        run: |
          echo "SECRET_KEY=test_secret_key_at_least_32_characters_long" >> $GITHUB_ENV
          echo "PII_ENCRYPTION_KEY=$(python -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())')" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql+asyncpg://arp:arp_password@localhost:5432/arp_db_test" >> $GITHUB_ENV
          echo "SYNC_DATABASE_URL=postgresql+psycopg2://arp:arp_password@localhost:5432/arp_db_test" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "CELERY_BROKER_URL=redis://localhost:6379/1" >> $GITHUB_ENV
          echo "CELERY_RESULT_BACKEND=redis://localhost:6379/2" >> $GITHUB_ENV
          echo "S3_ENDPOINT_URL=http://localhost:9000" >> $GITHUB_ENV
          echo "S3_ACCESS_KEY=minioadmin" >> $GITHUB_ENV
          echo "S3_SECRET_KEY=minioadmin" >> $GITHUB_ENV
          echo "GOOGLE_API_KEY=mock_key" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=sqlite:///mlflow_test.db" >> $GITHUB_ENV
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run migrations (test DB)
        run: |
          SYNC_DATABASE_URL=postgresql+psycopg2://arp:arp_password@localhost:5432/arp_db_test \
          python -m alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=backend \
            --cov=agents \
            --cov=graph \
            --cov=tools \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --asyncio-mode=auto

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── Docker Build Validation ──────────────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t arp-backend:ci-${{ github.sha }} \
            .

      - name: Verify image starts
        run: |
          docker run --rm \
            -e SECRET_KEY=test_secret_key_32_chars_minimum_x \
            -e PII_ENCRYPTION_KEY=$(python3 -c 'import os,base64;print(base64.b64encode(os.urandom(32)).decode())') \
            -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x \
            -e REDIS_URL=redis://localhost:6379/0 \
            --entrypoint python \
            arp-backend:ci-${{ github.sha }} \
            -c "from backend.app.config import settings; print('Config OK:', settings.app_version)"
