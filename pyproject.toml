[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-recruitment-pipeline"
version = "2.0.0"
description = "Autonomous Multi-Agent AI Recruitment Pipeline with LangGraph, FastAPI, and Celery"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "B008",   # Do not perform function call in argument defaults (standard in FastAPI: Depends, File, Form, Query)
    "B904",   # Within an except clause raise exceptions with from
    "E501",   # Line too long
    "E741",   # Ambiguous variable name
    "UP042",  # StrEnum inheritance (str, Enum is standard for SQLAlchemy / Pydantic v2)
    "RUF001", # Ambiguous unicode / en-dash
    "RUF002", # Docstring ambiguous unicode
    "RUF003", # Comment ambiguous unicode
    "RUF012", # Mutable class attributes
]

[tool.ruff.lint.per-file-ignores]
"backend/app/db/migrations/*" = ["E402", "F401", "I001"]
"main.py" = ["E402"]
"tests/*" = ["B008", "F401", "F811"]


[tool.black]
line-length = 120
target-version = ['py311']


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
